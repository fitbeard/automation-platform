name: build-eda

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Set image tag'
        required: true
        default: '1.3.15'
      ui-tag:
        description: 'Set UI image tag'
        required: true
        default: '2.7.14'

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - name: Install QEMU static binaries
        uses: docker/setup-qemu-action@v4.4.0

      - name: Configure Buildkit
        uses: docker/setup-buildx-action@v4.4.1

      - name: Checkout project
        uses: actions/checkout@v7

      - name: Authenticate with Quay.io
        uses: docker/login-action@v4.8.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Authenticate with source registry
        uses: docker/login-action@v4.8.0
        with:
          registry: registry.redhat.io
          username: ${{ secrets.VENDOR_ID }}
          password: ${{ secrets.VENDOR_SECRET }}

      - name: Build images
        run: |
          cd images/eda && \
          chmod +x build.sh && \
          chmod + extract-source-oci.sh && \
          VERSION=${{ github.event.inputs.tag }} UI_VERSION=${{ github.event.inputs.ui-tag }} ./build.sh --no-cache --push
