---
# AnsibleAutomationPlatform CR — Controller + EDA.
#
# Apply with:
#   kubectl apply -f deploy/ap-sample.yaml
#
# Component enable/disable convention (per
# roles/common/tasks/determine_if_enabled.yml, post-patch 0007):
#   - block omitted     -> behaviour depends on component default
#   - block + disabled  -> disabled
#   - block + no flag   -> enabled
#
# Defaults after patches:
#   - controller / eda      -> "missing block = enabled"
#   - hub / lightspeed / mcp -> "missing block = disabled"
# Hub/lightspeed/mcp are omitted entirely — they default to disabled and
# we don't ship operator rebuilds for them.
apiVersion: aap.ansible.com/v1alpha1
kind: AnsibleAutomationPlatform
metadata:
  name: ap
  namespace: ansible
spec:
  no_log: false
  image_pull_policy: IfNotPresent
  service_type: ClusterIP
  ingress_type: none
  # Required by tasks/set_gateway_url.yml so gateway knows its own public
  # URL for SSO redirects + service-data migration. Without it, gateway_url
  # falls back to "https://{{ hostname }}" — empty host on CRs without a
  # spec.hostname → migrate_service_data fails. Plug in your real public
  # URL once you wire HTTPRoute/Ingress.
  public_base_url: http://ap.ansible.svc.cluster.local
  # extra_settings:
  #   - setting: CSRF_COOKIE_SECURE
  #     value: false
  #   - setting: SESSION_COOKIE_SECURE
  #     value: false
  #
  # JWT/OIDC workload-identity feature (controller tech-preview). `feature_flags`
  # is a GLOBAL AAP toggle: the gateway-op fans each entry out to every component
  # (controller / eda / ...) as an extra_setting and into the gateway settings.
  # For the controller, FEATURE_OIDC_WORKLOAD_IDENTITY_ENABLED lets it mint OIDC
  # JWTs for credentials carrying a `workload_identity_token` field (federated
  # auth to external services instead of static secrets). The DAB feature_flags
  # app bridges the setting into django-flags.
  #
  # INSTALL-TIME flag: the django-flags DB row (dab_feature_flags.AAPFlag) is
  # seeded from the setting on the FIRST `awx-manage migrate`, so declaring it
  # here BEFORE the initial deploy makes both the setting path AND flag_enabled()
  # evaluate True. On an ALREADY-running cluster the controller's DB row persists
  # at its old value — re-seed once inside an awx-web/awx-task pod:
  #   awx-manage shell -c "from django.apps import apps; from ansible_base.feature_flags.utils import load_feature_flags; apps.get_model('dab_feature_flags','AAPFlag').objects.filter(name='FEATURE_OIDC_WORKLOAD_IDENTITY_ENABLED').delete(); load_feature_flags()"
  feature_flags:
    FEATURE_OIDC_WORKLOAD_IDENTITY_ENABLED: true
  # Defaults metrics ON (common/determine_if_enabled.yml sets
  # _metrics_enabled=true whenever `metrics` is defined, and `metrics:
  # {disabled: false}` is a role default so it is ALWAYS defined). The metrics
  # component deploys a MetricsService CR (automationmetricsservice.ansible.com)
  # whose operator/CRD we do NOT ship (automation-metrics-operator is out of
  # scope). Left enabled, the gateway-op reconcile fails on "Deploy
  # MetricsService" (no matches for kind). Disable it explicitly.
  metrics:
    disabled: true
  controller:
    name: awx
  eda:
    name: eda
    # Trim replicas to 1 across the board — defaults are 2 for
    # default_worker / activation_worker (api, ui default to 1). Saves pods on
    # a kind cluster. NOTE: (eda 1.3.x) REMOVED the `scheduler`
    # component (strict CRD decoding rejects it) and dropped Redis (dispatcherd
    # on PostgreSQL now) — components are api/ui/default_worker/activation_worker/
    # event_stream.
    default_worker:
      replicas: 1
    activation_worker:
      replicas: 1
    event_stream:
      replicas: 1

