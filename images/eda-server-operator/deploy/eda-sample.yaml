---
# Sample EDA CR for use with our hand-rolled chart at charts/eda-server-operator/.
#
# Apply with:
#   kubectl apply -f deploy/eda-sample.yaml
#
# No image / image_version / image_web / image_web_version fields needed —
# the chart sets RELATED_IMAGE_EDA + RELATED_IMAGE_EDA_UI env vars on the
# operator pod, and the role's `_image | default(env RELATED_IMAGE_*) |
# default(_default)` lookup chain pins them at reconcile time. To override
# the registry, set chart values relatedImages.eda / relatedImages.edaUi.
apiVersion: eda.ansible.com/v1alpha1
kind: EDA
metadata:
  name: eda
  namespace: ansible
spec:
  image_pull_policy: IfNotPresent
  service_type: ClusterIP
  ingress_type: none
  # CRD validation requires automation_server_url. Pointing it at the
  # awx-service we already have running in the awx-app namespace via the
  # awx-operator chart. EDA_ALLOW_LOCAL_RESOURCE_MANAGEMENT=true makes
  # EDA serve its own Team/User Access endpoints under /api/eda/v1/*, so
  # the UI doesn't actually depend on a real Automation Controller.
  automation_server_url: http://awx-service.ansible.svc.cluster.local
  automation_server_ssl_verify: 'no'
  extra_settings:
    - setting: EDA_ALLOW_LOCAL_RESOURCE_MANAGEMENT
      value: true
    # STANDALONE (no AAP gateway): EDA defaults RESOURCE_SERVER.URL to
    # https://localhost, which makes aap-eda restrict its REST auth to
    # gateway-JWT-only (dropping Session + Basic auth). Without a gateway you
    # can log in (session cookie is set) but every API call returns 403 — the
    # session is never consulted. Clearing it restores Session + Basic auth so
    # the UI/API work standalone. NOTE: the name MUST be the EDA_-prefixed env
    # form — extra_settings entries are rendered as EDA_* configmap env vars,
    # and only the env (not the settings file) overrides EDA's built-in
    # RESOURCE_SERVER.URL default. Remove this when deploying behind the AAP
    # gateway (which provides the JWT).
    - setting: EDA_RESOURCE_SERVER__URL
      value: ""
  # Single replica per component for kind/dev (default is 2). Drop these
  # blocks for production-sized deploys.
  # NOTE: (eda 1.3.x) removed the standalone `scheduler` component —
  # the 2.7 EDA CRD components are api, ui, default_worker, activation_worker,
  # event_stream (strict CRD decoding rejects `scheduler`).
  api:
    replicas: 1
  ui:
    replicas: 1
  default_worker:
    replicas: 1
  activation_worker:
    replicas: 1
  event_stream:
    replicas: 1

